# Лимиты запросов (conf.d/*.conf подключается внутри http {}, поэтому *_zone здесь допустимы).
# Для сервера на хостовом nginx (VPS) те же зоны лежат в deploy/nginx/.
limit_req_zone  $binary_remote_addr zone=ub_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ub_auth:10m    rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ub_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    limit_req  zone=ub_general burst=40 nodelay;
    limit_conn ub_conn 30;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Вход, регистрация, сброс пароля, API авторизации — строгий лимит.
    location ~ ^/(login|register|password-reset|api/v1/auth)(/|$) {
        limit_req  zone=ub_auth    burst=20 nodelay;
        limit_req  zone=ub_general burst=40 nodelay;
        limit_conn ub_conn 30;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
