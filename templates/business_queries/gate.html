<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{ query.title }} — ublogers</title>
<style>
  :root {
    --navy: #0f1b33;
    --orange: #ff7a30;
    --orange-dark: #e0621f;
    --text: #1c2333;
    --muted: #5b6478;
    --border: #e2e5ec;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5; padding: 16px;
  }
  .card {
    max-width: 380px; width: 100%; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .intro { font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input[type="password"] {
    width: 100%; border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-family: inherit; font-size: 14px; margin-bottom: 16px;
  }
  input[type="password"]:focus { outline: none; border-color: var(--orange); }
  .submit-btn {
    display: block; width: 100%; background: var(--orange); color: #fff; border: none;
    border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .submit-btn:hover { background: var(--orange-dark); }
  .alert-error {
    background: #fdecec; border: 1px solid #f3b8b8; color: #a52222;
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>{{ query.title }}</h1>
    {% if query.intro_text %}<p class="intro">{{ query.intro_text }}</p>{% endif %}

    {% if form.non_field_errors %}
    <div class="alert-error">{{ form.non_field_errors|join:", " }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="action" value="unlock">
      <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
      {{ form.password }}
      <button type="submit" class="submit-btn">Войти</button>
    </form>
  </div>
</body>
</html>
