<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ query.title }} — ublogers</title>
    {% load static %}
    <script src="{% static 'js/tailwind.cdn.js' %}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950:'#060B18', 900:'#0f172a', 800:'#1e293b', 700:'#334155' },
                        orange: { 400:'#fb923c', 500:'#f97316', 600:'#ea580c' },
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: white; }
        .card-dark { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
        .input-dark {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;
            border-radius: 0.75rem; padding: 0.625rem 0.875rem; width: 100%; font-size: 0.875rem; outline: none;
        }
        .input-dark:focus { border-color: rgba(249,115,22,0.5); box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
        .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); color: white; font-weight: 600; border-radius: 0.75rem; }
        .btn-orange:hover { opacity: 0.9; }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 0.875rem; }
    </style>
</head>
<body class="bg-navy-900 text-white min-h-screen flex items-center justify-center px-5">
    <div class="max-w-sm w-full card-dark rounded-2xl p-6">
        <h1 class="text-lg font-bold text-white mb-2">{{ query.title }}</h1>
        {% if query.intro_text %}
        <p class="text-xs text-slate-400 mb-4">{{ query.intro_text }}</p>
        {% endif %}

        {% if form.non_field_errors %}
        <div class="alert-error mb-4">{{ form.non_field_errors|join:", " }}</div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="action" value="unlock">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">{{ form.password.label }}</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-orange w-full py-3 rounded-xl text-sm">Войти</button>
        </form>
    </div>
</body>
</html>
