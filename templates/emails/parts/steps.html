<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:2px 0 8px">{% for step in steps %}
<tr><td style="width:34px;vertical-align:top;padding:0 0 12px"><div style="width:26px;height:26px;border-radius:13px;background:#F97316;color:#ffffff;font-size:14px;font-weight:700;line-height:26px;text-align:center">{{ forloop.counter }}</div></td>
<td style="vertical-align:top;padding:2px 0 12px;font-size:15px;line-height:1.55;color:#1f2937"><b>{{ step.0 }}</b> {{ step.1 }}</td></tr>{% endfor %}
</table>
