<div class="digit-boxes" data-digit-boxes data-length="{{ length }}" role="group" aria-label="{{ label }}">
    {% for i in positions %}
    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off"
           class="digit-box" aria-label="{{ label }}, цифра {{ forloop.counter }}"
           {% if forloop.first %}id="{{ widget_id }}"{% endif %}
           value="{{ i.digit }}">{% if i.gap_after %}<span class="digit-gap" aria-hidden="true"></span>{% endif %}
    {% endfor %}
    <input type="hidden" name="{{ name }}" value="{{ value }}" data-digit-value>
</div>

<style>
    .digit-boxes { display: flex; align-items: center; gap: 0.375rem; }
    .digit-gap { width: 0.625rem; }
    .digit-box {
        width: 2.5rem; height: 3rem; min-width: 0; padding: 0; text-align: center;
        font-size: 1.25rem; font-weight: 600; color: white;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 0.625rem;
    }
    .digit-box:focus { outline: none; border-color: rgba(249,115,22,0.5); box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
    @media (max-width: 400px) { .digit-box { width: 2rem; height: 2.75rem; font-size: 1.1rem; } }
</style>
<script>
(function () {
  function init(root) {
    if (root.dataset.ready) return;
    root.dataset.ready = '1';
    var boxes = Array.prototype.slice.call(root.querySelectorAll('.digit-box'));
    var hidden = root.querySelector('[data-digit-value]');
    function sync() {
      hidden.value = boxes.map(function (b) { return b.value; }).join('');
    }
    function fill(start, digits) {
      var i = start;
      for (var k = 0; k < digits.length && i < boxes.length; k++, i++) boxes[i].value = digits[k];
      boxes[Math.min(i, boxes.length - 1)].focus();
      sync();
    }
    boxes.forEach(function (box, idx) {
      box.addEventListener('input', function () {
        var digits = box.value.replace(/\D/g, '');
        box.value = '';
        if (digits) fill(idx, digits);
        else sync();
      });
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
          boxes[idx - 1].value = '';
          boxes[idx - 1].focus();
          sync();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          boxes[idx - 1].focus();
          e.preventDefault();
        } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
          boxes[idx + 1].focus();
          e.preventDefault();
        }
      });
      box.addEventListener('paste', function (e) {
        var text = (e.clipboardData || window.clipboardData).getData('text');
        var digits = text.replace(/\D/g, '');
        if (!digits) { e.preventDefault(); return; }
        e.preventDefault();
        fill(digits.length >= boxes.length ? 0 : idx, digits);
      });
      box.addEventListener('focus', function () { box.select(); });
    });
    sync();
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-digit-boxes]'), init);
})();
</script>
