{% comment %}Таблица «было → стало» для правок модератора. Параметр: rows — [(подпись, было, стало)].{% endcomment %}
<table class="w-full text-sm">
    <thead>
        <tr class="text-xs text-gray-500 text-left">
            <th class="py-1 pr-3 font-normal">Поле</th>
            <th class="py-1 pr-3 font-normal">Было</th>
            <th class="py-1 font-normal">Стало</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
        {% for label, old, new in rows %}
        <tr>
            <td class="py-1.5 pr-3 text-gray-600">{{ label }}</td>
            <td class="py-1.5 pr-3 text-gray-500 line-through">{{ old }}</td>
            <td class="py-1.5 text-gray-900">{{ new }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
