{% comment %}Условия кампании или оферты. Параметры: rows — [(подпись, значение)]; title.{% endcomment %}
{% if rows %}
<dl class="space-y-2 text-sm" data-terms>
    {% for label, value in rows %}
    <div class="flex flex-wrap justify-between gap-x-4 gap-y-0.5">
        <dt class="text-gray-500 min-w-0">{{ label }}</dt>
        <dd class="ml-auto min-w-0 max-w-full font-medium text-gray-900 text-right whitespace-pre-line break-words">{{ value }}</dd>
    </div>
    {% endfor %}
</dl>
{% endif %}
