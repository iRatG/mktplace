# Лимиты внутри блока server {} для ublogers.uz (443).
# Кладётся в /etc/nginx/snippets/ublogers-limits.conf и подключается одной
# строкой внутри server {}:   include /etc/nginx/snippets/ublogers-limits.conf;
#
# Важно: limit_req наследуется вложенным location только если в нём нет своих
# limit_req, поэтому в location для авторизации общий лимит продублирован.

# Общий лимит для всех путей, у которых нет своего location ниже.
limit_req  zone=ub_general burst=40 nodelay;
limit_conn ub_conn 30;

# Чувствительные пути: вход, регистрация (в т. ч. /register/legal-entity/ и
# /register/blogger/verify/), сброс пароля, API авторизации.
# burst=20 — запас на несколько человек с одного адреса и несколько открытых вкладок.
location ~ ^/(login|register|password-reset|api/v1/auth)(/|$) {
    limit_req  zone=ub_auth    burst=20 nodelay;
    limit_req  zone=ub_general burst=40 nodelay;
    limit_conn ub_conn 30;

    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
    proxy_connect_timeout 60;
}
