# Зоны ограничения запросов (контекст http).
# Кладётся в /etc/nginx/conf.d/ublogers-ratelimit.conf — conf.d/*.conf
# подключается внутри блока http {}, поэтому директивы *_zone здесь допустимы.
#
# $binary_remote_addr — реальный IP клиента, пока nginx стоит первым в цепочке.
# Если перед nginx стоит прокси (например, Cloudflare), без модуля real_ip лимиты
# считаются по адресам прокси, а не посетителей.

# Обычные страницы и статика: 20 запросов/с с одного IP (всплеск до 40 разрешён
# в ublogers-limits.conf — страница с десятком ассетов открывается без задержек).
limit_req_zone  $binary_remote_addr zone=ub_general:10m rate=20r/s;

# Вход, регистрация, сброс пароля, API авторизации: 30 запросов/мин с IP (нескольким
# людям с одного адреса — офис, мобильный оператор — должно хватать; точные лимиты по
# неудачным попыткам считает приложение).
limit_req_zone  $binary_remote_addr zone=ub_auth:10m    rate=30r/m;

# Одновременных соединений с одного IP.
limit_conn_zone $binary_remote_addr zone=ub_conn:10m;

# Клиенту отдаём 429 (а не 503 по умолчанию) — так понятно, что это лимит.
limit_req_status  429;
limit_conn_status 429;
